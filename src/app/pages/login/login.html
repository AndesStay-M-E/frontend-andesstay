<main class="login-page">
  <section class="login-card">
    <div class="brand">
      <span class="brand-icon">A</span>
      <div>
        <h1>AndesStay</h1>
        <p>Gestión de reservas de hostales y cabañas</p>
      </div>
    </div>

    <div class="content">
      <h2>Bienvenido</h2>
      <p>
        Inicia sesión con tu cuenta de Microsoft para acceder a la plataforma.
      </p>

      <button type="button" (click)="login()">
        Iniciar sesión con Microsoft
      </button>
    </div>

    <p class="security-message">
      Acceso protegido mediante Microsoft Entra ID
    </p>
  </section>
</main>
